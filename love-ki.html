<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ถึงแฟน รักนะ 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe9f0;--bg2:#ffc6d8;--card:#fffffff2;--text:#5a1f35;--accent:#e8446d;--muted:#a05a74;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a0f1b;--bg2:#4a1730;--card:#3a1426ee;--text:#ffe4ec;--accent:#ff7a9c;--muted:#e0a3b8;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a0f1b;--bg2:#4a1730;--card:#3a1426ee;--text:#ffe4ec;--accent:#ff7a9c;--muted:#e0a3b8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Mali","Sarabun",system-ui,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;display:flex;justify-content:center;padding:22px 16px 40px;overflow-x:hidden}
.wrap{width:100%;max-width:460px;text-align:center;position:relative;z-index:2}
.card{background:var(--card);border-radius:26px;padding:26px 20px;margin-bottom:18px;box-shadow:0 8px 30px #e8446d33}
h1{font-size:2rem;margin:.1em 0;color:var(--accent)}
.big{font-size:2.8rem;animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.muted{color:var(--muted);font-size:.95rem}
.count{font-size:2.6rem;font-weight:600;color:var(--accent);line-height:1.1}
.date{font-size:.9rem;color:var(--muted)}
#msg{font-size:1.25rem;line-height:1.75;margin:14px 4px 18px;min-height:5.5em;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
button{font-family:inherit;font-size:1rem;border:0;border-radius:999px;padding:11px 22px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 4px 14px #e8446d55;margin:4px}
button.alt{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
button:active{transform:scale(.95)}
.pics{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.pol{background:#fff;padding:8px 8px 10px;border-radius:6px;box-shadow:0 6px 18px #0003;width:46%;min-width:140px;color:#5a1f35;font-size:.85rem}
.pol img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:3px;margin-bottom:6px}
.pol:nth-child(1){transform:rotate(-3deg)}.pol:nth-child(2){transform:rotate(3deg)}
.heart{position:fixed;bottom:-40px;z-index:1;pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.game{position:relative;height:130px;margin:10px 0}
.game button{position:absolute;top:40px;transition:left .25s,top .25s}
#yes{left:calc(50% - 90px)}#no{left:calc(50% + 10px)}
.pol{cursor:pointer;transition:transform .3s}
.pol.w{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-8deg) scale(1.06)}75%{transform:rotate(8deg) scale(1.06)}}
.tap{position:fixed;z-index:5;pointer-events:none;animation:pop .9s ease-out forwards;font-size:26px}
@keyframes pop{to{transform:translateY(-60px) scale(1.6);opacity:0}}
#env{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--bg1),var(--bg2));cursor:pointer;transition:opacity .7s,transform .7s;text-align:center;padding:20px}
#env.gone{opacity:0;transform:scale(1.4);pointer-events:none}
#env .e{font-size:6rem;animation:beat 1.2s infinite}
</style>
</head>
<body>

"เค้าติดแฟนมากนะ รู้ตัวไหม",
"จุ๊บหน้าผากแฟนหนึ่งที 😘",
"วันนี้ก็ภูมิใจในตัวแฟนนะ",
"อยากให้แฟนอยู่ใกล้ ๆ ทุกวัน",
"เค้าไม่เก่งเรื่องพูด แต่รักแฟนจริง ๆ นะ",
"แฟนยิ้มทีไร เค้าใจฟูทุกที",
"อยากกอดแฟนแน่น ๆ อีกสักที",
"ไม่ว่าวันไหน เค้าก็เลือกแฟนเสมอ",

];
var TH=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
var MO=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
var now=new Date();
var dayNo=Math.floor(new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime()/864e5);
var idx=((dayNo%MSGS.length)+MSGS.length)%MSGS.length;
var msg=document.getElementById("msg");
document.getElementById("date").textContent="ข้อความของวัน"+TH[now.getDay()]+"ที่ "+now.getDate()+" "+MO[now.getMonth()]+" "+(now.getFullYear()+543);
var tw;function show(i){clearInterval(tw);var c=Array.from(MSGS[i]),n=0;msg.textContent="";tw=setInterval(function(){n++;msg.textContent=c.slice(0,n).join("");if(n>=c.length)clearInterval(tw)},45)}
function hearts(n){for(var k=0;k<n;k++){var h=document.createElement("div");h.className="heart";h.textContent=["💗","💖","💕","❤️","🌸"][Math.floor(Math.random()*5)];h.style.left=Math.random()*100+"vw";h.style.fontSize=(18+Math.random()*26)+"px";h.style.animationDuration=(3+Math.random()*3)+"s";document.body.appendChild(h);(function(x){setTimeout(function(){x.remove()},6500)})(h)}}
var cur=idx;
document.getElementById("more").onclick=function(){cur=(cur+1)%MSGS.length;show(cur);hearts(8)};
document.getElementById("send").onclick=function(){hearts(40);clearInterval(tw);msg.textContent="เค้ารับรักไว้แล้วนะ ❤️ รักแฟนเหมือนกัน!"};
document.getElementById("env").onclick=function(){this.classList.add("gone");hearts(30);show(idx)};
document.addEventListener("pointerdown",function(e){var s=document.createElement("div");s.className="tap";s.textContent=["💗","💖","✨","💕"][Math.floor(Math.random()*4)];s.style.left=(e.clientX-12)+"px";s.style.top=(e.clientY-12)+"px";document.body.appendChild(s);setTimeout(function(){s.remove()},900)});
Array.prototype.forEach.call(document.querySelectorAll(".pol"),function(p){p.onclick=function(){p.classList.remove("w");void p.offsetWidth;p.classList.add("w");hearts(6)}});
var no=document.getElementById("no"),g=document.getElementById("game");
function run(e){if(e&&e.preventDefault)e.preventDefault();var w=g.clientWidth-no.offsetWidth,h=g.clientHeight-no.offsetHeight;no.style.left=Math.random()*w+"px";no.style.top=Math.random()*h+"px"}
no.addEventListener("pointerenter",run);no.addEventListener("pointerdown",run);no.addEventListener("click",run);
var cnt=0;try{cnt=parseInt(localStorage.getItem("love")||"0",10)||0}catch(e){}
function tally(){document.getElementById("tally").textContent=cnt?"ส่งรักไปแล้ว "+cnt+" ครั้ง 💞":""}tally();
document.getElementById("yes").onclick=function(){cnt++;try{localStorage.setItem("love",String(cnt))}catch(e){}tally();hearts(50);document.getElementById("yesout").textContent="รู้อยู่แล้วว่าต้องรัก 😆 เค้าก็รักแฟนที่สุดในโลกเหมือนกัน ❤️"};
hearts(10);setInterval(function(){hearts(1)},1800);
</script>
